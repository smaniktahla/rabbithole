services:
  rabbithole:
    build: .
    container_name: rabbithole
    labels:
      kuma.rabbithole.http.name: "Rabbithole"
      kuma.rabbithole.http.url: "http://10.10.10.13:8095/"
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      - rabbithole-data:/app/data
      - /mnt:/mnt          # exposes all TrueNAS/NFS mounts to container
    environment:
      - TZ=America/New_York
      - REELMEALS_URL=${REELMEALS_URL:-http://10.10.10.13:8092}
      - REELMEALS_INGEST_API_KEY=${REELMEALS_INGEST_API_KEY:-}

volumes:
  rabbithole-data:
